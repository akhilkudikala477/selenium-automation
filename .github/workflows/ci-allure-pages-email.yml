name: CI — Tests → Allure → Pages → Email

on:
  push:
    branches: [ practiceproject ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:

      # STEP 1: Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # STEP 2: Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # STEP 3: Cache Maven
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}

      # STEP 4: Run Tests
      - name: Run Tests (Do not stop on failure)
        run: mvn clean test || true

      # STEP 5: Verify Allure Results
      - name: Verify Allure Results
        run: ls -la target/allure-results

      # STEP 6: Install Allure CLI
      - name: Install Allure
        run: |
          curl -Lo allure.tgz https://github.com/allure-framework/allure2/releases/download/2.24.1/allure-2.24.1.tgz
          sudo tar -zxvf allure.tgz -C /opt/
          sudo ln -sf /opt/allure-2.24.1/bin/allure /usr/bin/allure
          allure --version

      # STEP 7: Generate Report
      - name: Generate Report
        run: allure generate target/allure-results --clean -o allure-report

      # STEP 8: Upload Pages Artifact
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      # STEP 9: Deploy Pages
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # STEP 10: Send Email with Allure Report Link
      - name: Send email with report link
        if: always()
        env:
          MAIL_CONNECTION: ${{ secrets.MAIL_CONNECTION }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |

          echo "GitHub Pages URL is: $PAGE_URL"

          python3 <<EOF
          import os, smtplib, ssl
          from urllib.parse import urlparse
          from email.message import EmailMessage

          conn = os.getenv("MAIL_CONNECTION")

          if not conn:
              print("MAIL_CONNECTION missing")
              exit(0)

          parsed = urlparse(conn)

          username = parsed.username
          password = parsed.password
          host = parsed.hostname
          port = parsed.port or 587

          page_url = os.getenv("PAGE_URL")

          # Fallback if GitHub does not return page_url
          if not page_url:
              repo = os.getenv("REPO")
              username_repo = repo.split("/")[0]
              repo_name = repo.split("/")[1]
              page_url = f"https://{username_repo}.github.io/{repo_name}/"

          workflow_url = f"https://github.com/{os.getenv('REPO')}/actions/runs/{os.getenv('RUN_ID')}"

          msg = EmailMessage()
          msg['Subject'] = "Automation Allure Report Ready"
          msg['From'] = username
          msg['To'] = username

          msg.set_content(f"Allure Report: {page_url}")

          msg.add_alternative(f'''
          <h2>Automation Execution Completed</h2>

          <p>
          <a href="{page_url}" 
             style="background:#28a745;color:white;padding:12px 20px;text-decoration:none;border-radius:5px;">
             VIEW ALLURE REPORT
          </a>
          </p>

          <br>

          <p>
          <a href="{workflow_url}">
             View Workflow Run
          </a>
          </p>
          ''', subtype='html')

          context = ssl.create_default_context()

          with smtplib.SMTP(host, port) as server:
              server.starttls(context=context)
              server.login(username, password)
              server.send_message(msg)

          print("EMAIL SENT SUCCESSFULLY")

          EOF
