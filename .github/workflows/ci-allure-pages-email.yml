name: CI - Tests - Allure - Pages - Email

on:
  push:
    branches: [ practiceproject ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}

      - name: Run Tests
        run: mvn -B clean test

      - name: Debug Allure Results
        run: |
          echo "Searching for allure-results folders..."
          find . -type d -name "allure-results"
          echo "Searching for result json files..."
          find . -name "*-result.json"

      - name: Install Allure CLI
        run: |
          curl -Lo allure.tgz https://github.com/allure-framework/allure2/releases/download/2.24.1/allure-2.24.1.tgz
          sudo tar -zxvf allure.tgz -C /opt/
          sudo ln -sf /opt/allure-2.24.1/bin/allure /usr/bin/allure
          allure --version

      - name: Generate Allure Report
        run: |
          RESULTS=$(find . -type d -name "allure-results" | tr '\n' ' ')
          echo "Found results in: $RESULTS"

          if [ -z "$RESULTS" ]; then
            echo "No allure-results found!"
            exit 1
          fi

          allure generate $RESULTS --clean -o allure-report
          ls -la allure-report

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Email with Report Link
        if: always()
        env:
          MAIL_CONNECTION: ${{ secrets.MAIL_CONNECTION }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "GitHub Pages URL is: $PAGE_URL"

          python3 <<EOF
import os, smtplib, ssl
from urllib.parse import urlparse
from email.message import EmailMessage

conn = os.getenv("MAIL_CONNECTION")
if not conn:
    print("MAIL_CONNECTION missing")
    exit(0)

parsed = urlparse(conn)

username = parsed.username
password = parsed.password
host = parsed.hostname
port = parsed.port or 587

page_url = os.getenv("PAGE_URL")

if not page_url:
    repo = os.getenv("REPO")
    username_repo = repo.split("/")[0]
    repo_name = repo.split("/")[1]
    page_url = f"https://{username_repo}.github.io/{repo_name}/"

workflow_url = f"https://github.com/{os.getenv('REPO')}/actions/runs/{os.getenv('RUN_ID')}"

msg = EmailMessage()
msg['Subject'] = "Automation Allure Report Ready"
msg['From'] = username
msg['To'] = username

msg.set_content(f"Allure Report: {page_url}")

msg.add_alternative(f"""
<h2>Automation Execution Completed</h2>
<p>
<a href="{page_url}" style="background:#28a745;color:white;padding:12px 20px;text-decoration:none;border-radius:5px;">
VIEW ALLURE REPORT
</a>
</p>
<br>
<p>
<a href="{workflow_url}">
View Workflow Run
</a>
</p>
""", subtype='html')

context = ssl.create_default_context()

with smtplib.SMTP(host, port) as server:
    server.starttls(context=context)
    server.login(username, password)
    server.send_message(msg)

print("EMAIL SENT SUCCESSFULLY")
EOF