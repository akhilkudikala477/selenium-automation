name: Selenium Tests (manual run only + choice params)

on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Select browser'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox

      suite:
        description: 'Select suite (value corresponds to your pom property ${suiteXmlFile})'
        required: true
        default: 'testng_sanity'
        type: choice
        options:
          - testng_sanity
          - testng_regression


jobs:
  test:

    runs-on: ubuntu-latest

    env:
      CI: true

    steps:

      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4


      # Cache Maven dependencies
      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-


      # Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      # Setup Chrome
      - name: Setup Google Chrome
        if: ${{ github.event.inputs.browser == 'chrome' }}
        uses: browser-actions/setup-chrome@v1


      # Setup Firefox
      - name: Install Firefox
        if: ${{ github.event.inputs.browser == 'firefox' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y firefox


      # Verify versions
      - name: Show Java & Maven versions
        run: |
          java -version
          mvn -version


      # Run tests
      - name: Run Maven tests
        run: |
          mvn --batch-mode clean test \
          -Dbrowser=${{ github.event.inputs.browser }} \
          -DsuiteXmlFile=${{ github.event.inputs.suite }}


      # Upload Surefire reports
      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports


      # Upload Allure results
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results


      # Send Email Notification (SUCCESS + FAILURE)
      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:

          server_address: smtp.gmail.com
          server_port: 465

          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          subject: |
            Selenium Execution ${{ job.status }} | Browser: ${{ github.event.inputs.browser }} | Suite: ${{ github.event.inputs.suite }}

          body: |
            Selenium Automation Execution Result: ${{ job.status }}

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Triggered by: ${{ github.actor }}

            Browser: ${{ github.event.inputs.browser }}
            Suite: ${{ github.event.inputs.suite }}

            View Full Report:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          to: your_email@gmail.com
          from: ${{ secrets.EMAIL_USERNAME }}
